# This file is included from /etc/nginx/nginx.conf inside the `http {}` block.
# Only http-context directives are allowed here (no `user`, `events`, `worker_processes`).

# Cache and content-type helpers
map $sent_http_content_type $expires_static {
	default                    off;
	"text/html"               epoch;
	"application/javascript"  max;
	"text/css"               max;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

server {
	listen       80 default_server;
	listen       [::]:80 default_server;
	server_name  _;

	root /usr/share/nginx/html;
	index index.html;

	# SPA fallback for client-side routing
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Long cache for static assets
	location ~* \.(?:css|js|json|map|jpg|jpeg|png|gif|ico|svg|eot|ttf|woff|woff2)$ {
		try_files $uri =404;
		expires 1y;
		access_log off;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
}
